name: Crawl Goyang & Notify

on:
  schedule:
    # Daily Goyang crawler health refresh at 09:10 KST.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run Goyang crawl outside the KST 05:00~22:00 window"
        required: false
        default: "false"

concurrency:
  group: tennis-crawl-goyang
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, Windows, X64, tennis-local]
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe"
          if (-not (Test-Path $python)) { $python = "python" }
          & $python --version
          & $python -m pip install --upgrade pip
          & $python -m pip install -r requirements.txt

      - name: Refresh Korean gov SSL pins
        continue-on-error: true
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe"
          if (-not (Test-Path $python)) { $python = "python" }
          & $python fetch_korea_gov_certs.py

      - name: Run refresh (Goyang)
        shell: powershell
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_TARGET: "goyang"
          FORCE_GOYANG_CRAWL: ${{ inputs.force }}
          GYT_USE_CURL_CFFI: "1"
          GYT_DEBUG_DUMP: "1"
          GYT_PROXY_URL: ${{ secrets.GYT_PROXY_URL }}
          GYS_ID: ${{ secrets.GYS_ID }}
          GYS_PW: ${{ secrets.GYS_PW }}
          GYT_TAILSCALE_EXIT_NODE: ""
          CRAWL_TAILSCALE_EXIT_NODE: ""
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          $python = "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe"
          if (-not (Test-Path $python)) { $python = "python" }
          .\scripts\run_local_refresh.ps1 -Target goyang -Python $python

      - name: Upload gytennis debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gytennis-debug-goyang
          path: debug/gytennis
          if-no-files-found: ignore
